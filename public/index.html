<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>استوديو الصور والفيديو</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <header class="topbar">
      <div>
        <p class="eyebrow">صنع الصور والفيديو</p>
        <h1>الاستوديو</h1>
      </div>
      <div class="top-actions">
        <span id="quotaBadge" class="badge">جاري التحميل…</span>
        <a class="ghost-link" href="/admin">لوحة الإدارة</a>
      </div>
    </header>

    <main class="shell">
      <section class="card composer">
        <div class="mode-toggle" role="tablist">
          <button type="button" class="mode active" data-mode="image" aria-selected="true">صورة</button>
          <button type="button" class="mode locked" data-mode="video" id="videoModeBtn" aria-selected="false" aria-disabled="true">فيديو <span class="lock-tag" id="videoLockTag">مقفل</span></button>
        </div>

        <label class="field">
          <span>الوصف</span>
          <textarea id="prompt" rows="4" maxlength="2000" placeholder="صف المشهد اللي تبيه، مثلاً: واحة نجدية تحت سماء مرصعة بالنجوم…"></textarea>
        </label>

        <div class="options">
          <label class="field">
            <span>الأسلوب</span>
            <select id="style"></select>
          </label>
          <label class="field">
            <span>الأبعاد</span>
            <select id="aspectRatio"></select>
          </label>
          <label class="field">
            <span>الحجم</span>
            <select id="resolution"></select>
          </label>
          <label class="field" id="countField">
            <span>العدد</span>
            <select id="count"></select>
          </label>
          <label class="field hidden" id="durationField">
            <span>مدة الفيديو</span>
            <select id="duration"></select>
          </label>
        </div>

        <button type="button" id="generateBtn" class="primary">إنشاء</button>
        <p id="status" class="status" hidden></p>
        <p class="hint" id="composerHint">النتائج تُحفظ في معرضك على هذا الجهاز. سياسة المحتوى تنطبق على الجميع.</p>
      </section>

      <section class="gallery-wrap">
        <div class="section-head">
          <h2>المعرض</h2>
          <span id="galleryCount" class="muted"></span>
        </div>
        <div id="gallery" class="gallery"></div>
        <p id="emptyGallery" class="empty">بعد ما تنشئ أول صورة أو فيديو، تظهر هنا.</p>
      </section>
    </main>

    <script src="/js/app.js" type="module"></script>
  </body>
</html>
